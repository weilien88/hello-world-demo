<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101827; color: #f8fafc; font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 620px; padding: 64px 32px; text-align: center; background: #19263b; border: 1px solid #33445d; border-radius: 24px; box-shadow: 0 24px 64px #0003; }
    h1 { margin: 0 0 16px; font-size: clamp(40px, 8vw, 64px); letter-spacing: -0.05em; }
    p { margin: 0; color: #becde0; font-size: 18px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
    <p>Built with Codex, deployed on Cloudflare Workers.</p>
  </main>
</body>
</html>
